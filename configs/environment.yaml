# M2 Easy baseline. Geometry, mass, damping and motor limits stay in the XML.
model_path: assets/mujoco/arena.xml
# 50 substeps x 1 ms keeps the policy interval at 50 ms (20 Hz).
frame_skip: 50
max_steps: 500

# The entire transported object must fit and remain slow for these steps.
goal_center: [1.8, 1.5]
goal_half_size: [0.75, 0.65]
success_linear_speed: 0.05
success_angular_speed: 0.1
success_hold_steps: 5

# Object/goal randomization stays broad; agents spawn randomly near the object.
randomize_reset: true
reset_distribution: near_object
# Random surface-to-surface gap between each agent and the object, in meters.
agent_spawn_gap: [0.04, 0.15]
arena_spawn_margin: 0.15
minimum_goal_distance: 1.5
spawn_clearance: 0.04
reset_attempts: 100

# Shared reward. Time penalty is per agent decision, not per physics substep.
progress_weight: 2.0
success_reward: 20.0
time_penalty: 0.001
failure_penalty: 20.0

# Fail the episode if any physics substep violates these diagnostic limits.
max_penetration: 0.005
max_linear_speed: 5.0
max_angular_speed: 10.0
