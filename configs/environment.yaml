# One fixed Easy scenario; every reset uses these exact coordinates.
model_path: assets/mujoco/arena.xml
frame_skip: 50
max_steps: 500
object_pose: [-1.5, -1.5, 0.0]
agent_positions:
  - [-1.68, -1.05]
  - [-1.32, -1.05]
  - [-1.61, -1.76]
  - [-1.61, -1.24]
goal_center: [1.5, 1.5]
goal_half_size: [0.75, 0.65]
goal_yaw: 0.0
success_linear_speed: 0.05
success_angular_speed: 0.1
success_hold_steps: 5

# The four requested reward components.
distance_weight: 0.1
orientation_weight: 0.05
progress_weight: 2.0
success_reward: 20.0
distance_scale: 1.0
orientation_distance_scale: 1.0
failure_penalty: 20.0

# Physical safety checks, not motion controllers.
max_penetration: 0.005
max_linear_speed: 5.0
max_angular_speed: 10.0
