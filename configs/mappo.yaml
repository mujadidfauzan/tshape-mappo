# M3 implementation baseline; tune only after smoke checks pass.
seed: 42
device: cpu
total_steps: 100000
# When set, this cumulative episode budget takes precedence over total_steps.
total_episodes: null
rollout_steps: 1024
ppo_epochs: 5
num_minibatches: 1
actor_hidden_size: 128
critic_hidden_size: 256
actor_lr: 0.0003
critic_lr: 0.0003
gamma: 0.99
gae_lambda: 0.95
clip_ratio: 0.2
value_clip: 0.2
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5
target_kl: 0.03
initial_log_std: -0.5
normalize_inputs: true
normalization_clip: 10.0
checkpoint_interval: 10
eval_interval: 10
eval_episodes: 5
eval_seed: 100000
torch_threads: 1
# One deterministic evaluation video per 10,000 completed training episodes.
# Set the interval to 0 to disable automatic video recording.
video_interval_episodes: 10000
video_width: 1920
video_height: 1080
video_crf: 18
