# Easy only. Budgets count joint environment timesteps.
seed: 42
device: cpu
total_steps: 100000
rollout_steps: 1024
ppo_epochs: 5
num_minibatches: 1
actor_hidden_size: 128
critic_hidden_size: 256
actor_lr: 0.0003
critic_lr: 0.0003
gamma: 0.99
gae_lambda: 0.95
clip_ratio: 0.2
value_clip: 0.2
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5
target_kl: 0.03
initial_log_std: -0.5
normalize_inputs: true
normalization_clip: 10.0
torch_threads: 1

# Random-agent runs use ten seeded layouts; fixed-agent runs need one.
eval_interval_steps: 10000
eval_episodes: 10
checkpoint_interval_steps: 10000
video_interval_steps: 100000
video_width: 1920
video_height: 1080
video_crf: 18
tensorboard: true
stats_window_size: 100
reward_log_interval_steps: 100
