# Independent policies support 2, 4, 8 or 16 agents.
num_agents: 4
# Fixed two-room Medium arena. Actor observations and reward match Easy.
# Fixed goal in the right room; random object starts in the left room.
# Agents start at random exterior positions near the object.
difficulty: medium
model_path: assets/mujoco/arena_medium.xml
frame_skip: 50
# 1,500 decisions x 50 ms = 75 seconds of simulated time.
max_steps: 1500
goal_center: [1.8, 1.5]
goal_half_size: [0.75, 0.65]
success_linear_speed: 0.05
success_angular_speed: 0.1
success_hold_steps: 5
randomize_reset: true
randomize_goal: false
reset_distribution: near_object
# Random surface-to-surface gap between each agent and the object, in meters.
agent_spawn_gap: [0.04, 0.15]
arena_spawn_margin: 0.15
minimum_goal_distance: 1.5
spawn_clearance: 0.04
reset_attempts: 100
reward_mode: pose
goal_yaw: 0.0
distance_weight: 0.1
orientation_weight: 0.05
distance_scale: 1.0
orientation_distance_scale: 1.0
progress_weight: 2.0
success_reward: 20.0
# Exceptional terminal penalty for invalid physics.
failure_penalty: 20.0
max_penetration: 0.005
max_linear_speed: 5.0
max_angular_speed: 10.0
