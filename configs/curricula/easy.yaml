difficulty: easy
validation_interval_steps: 50000
validation_episodes: 20
validation_seed: 150000
success_threshold: 0.7
consecutive_checks: 2
minimum_stage_steps: 50000
stages:
  - name: E1_short_transport
    max_steps: 250
    object_goal_distance_range: [0.8, 1.2]
    object_yaw_range: [-0.15, 0.15]
  - name: E2_position_and_yaw
    max_steps: 400
    object_goal_distance_range: [1.2, 2.0]
    object_yaw_range: [-0.75, 0.75]
  - name: E3_full_task
